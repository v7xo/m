# DO NOT EDIT THIS FILE
#
# main goal of the presence of this file - IDE's linting support (for ex. VS Code)

lint:
  rules:
    all_default: true
    remove:
      - FIELD_NAMES_EXCLUDE_PREPOSITIONS
      - FILE_HAS_COMMENT
      - MESSAGE_NAMES_EXCLUDE_PREPOSITIONS
      - REPEATED_FIELD_NAMES_PLURALIZED
  rules_option:
    max_line_length:
      max_chars: 220
