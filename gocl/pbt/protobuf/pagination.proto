syntax = "proto3";

package v7xo.protobuf;

option go_package = "rn.m.vo7.io/vo7io/m/gocl/pbt/types";

// Размер страницы данных.
enum PageSize
{
  // Отсутствует/не указано.
  PAGE_SIZE_UNSPECIFIED = 0;
  // 50 элементов на страницу.
  PAGE_SIZE_50 = 1;
  // 100 элементов на страницу.
  PAGE_SIZE_100 = 2;
  // 150 элементов на страницу.
  PAGE_SIZE_150 = 3;
  // 200 элементов на страницу.
  PAGE_SIZE_200 = 4;
  // 250 элементов на страницу.
  PAGE_SIZE_250 = 5;
  // 4294967295 элементов на страницу.
  PAGE_SIZE_UINT32_MAX = 6;
  // 1000 элементов на страницу.
  PAGE_SIZE_1000 = 7;
  // 5000 элементов на страницу.
  PAGE_SIZE_5000 = 8;
  // 10000 элементов на страницу.
  PAGE_SIZE_10000 = 9;
}

// Параметры пагинации.
message Pagination
{
  // Смещение.
  uint32 offset = 1;
  // Лимит. Он же - размер страницы.
  PageSize limit = 2;
}
